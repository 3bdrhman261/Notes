name: notes_app
description: Notes app with Floor (SQLite), location and shake-to-delete.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  floor: ^1.5.0
  sqflite: ^2.4.4
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  shake: ^3.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  floor_generator: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
